<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F4EEE4" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#556B4E" />
      <stop offset="100%" stop-color="#6E8566" />
    </linearGradient>
  </defs>

  <!-- Cream Card Container -->
  <rect x="1" y="1" width="848" height="238" rx="16" fill="url(#creamGrad)" stroke="#E2DACD" stroke-width="1.5" />

  <!-- Name -->
  <text x="48" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="750" fill="#222627" letter-spacing="-0.5">Lakshana G S.</text>

  <!-- Tagline: AI · Software · Engineering (Prominent Size) -->
  <text x="48" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="url(#sageGrad)" letter-spacing="0.4">AI &#183; Software &#183; Engineering</text>

  <!-- Subtle Warm Divider -->
  <line x1="48" y1="125" x2="802" y2="125" stroke="#E6DFD2" stroke-width="1.2" />

  <!-- Bio Quote -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3D4547" letter-spacing="0.1">
    <text x="48" y="160">&#8220;I'm a Computer Science student interested in building practical solutions with AI,</text>
    <text x="48" y="186">software development, and full-stack technologies. I enjoy learning by building</text>
    <text x="48" y="212">and turning ideas into working projects.&#8221;</text>
  </g>

  <!-- Subtle Accent Dot -->
  <circle cx="798" cy="209" r="4" fill="#556B4E" opacity="0.6" />
